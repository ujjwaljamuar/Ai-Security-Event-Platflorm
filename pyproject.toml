[project]
name = "ai-security-event-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.120",
    "fastapi>=0.162.0",
    "openai>=3.40.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["app"]
